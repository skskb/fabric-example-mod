name: Revert to 7a2901d

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      - name: Restore files to 7a2901d
        run: |
          git rm -rf .
          git checkout 7a2901d -- .
          git add -A
          git commit -m "Revert repository to commit 7a2901d"
          git push
